# ============================================================
# AfiaHealth API - Application Configuration
# ============================================================
spring:
  application:
    name: afiahealth-api

  # Database
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:afiahealth}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:afiahealth}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Cache
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@afiahealth.africa}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Server
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:afiahealth-super-secret-key-for-jwt-signing-minimum-256-bits-long}
  access-token-expiry: 3600000       # 1 hour in ms
  refresh-token-expiry: 604800000    # 7 days in ms

# Google Maps
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:your-google-maps-api-key}

# AWS S3
aws:
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:afiahealth-uploads}
    region: ${AWS_REGION:eu-west-1}

# AfiaHealth App Config
afiahealth:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin-email: admin@afiahealth.africa
  default-page-size: 20
  max-page-size: 100

# Logging
logging:
  level:
    com.afiahealth: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: AfiaHealth API
    description: Africa's Premier Healthcare Discovery Platform REST API
    version: 1.0.0

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
